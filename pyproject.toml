[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-accel"
dynamic = ["version"]
description = "gh-accel —— 本地 GitHub 下载加速代理：国内镜像优先、多源竞速、完整性校验、本地缓存"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZhangJun", email = "ezunai@126.com" }]
keywords = ["github", "proxy", "mirror", "accelerator", "download"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
gh-accel = "gh_accel.cli:main"

[project.urls]
Homepage = "https://github.com/osmos/gh-accel"
Repository = "https://github.com/osmos/gh-accel"
Issues = "https://github.com/osmos/gh-accel/issues"
Changelog = "https://github.com/osmos/gh-accel/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "gh_accel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gh_accel = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
