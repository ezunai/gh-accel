[Service]
# 让 dockerd 的 registry 流量走 gh-accel 本地代理。
#
# 生效方式:
#   systemctl --user 无法管理系统服务, 这里生成的是**系统级** drop-in,
#   需要 root:
#     sudo mkdir -p /etc/systemd/system/docker.service.d
#     sudo cp <此文件> /etc/systemd/system/docker.service.d/gh-accel.conf
#     sudo systemctl daemon-reload && sudo systemctl restart docker
#
# 也可以用 scripts/docker-proxy.sh enable 一键完成。
#
# 注意:
# * SSL_CERT_FILE 指向「系统 CA + 本地 CA」的合集。Go 的 crypto/x509
#   读该环境变量; 指向只有本地 CA 的文件会让 dockerd 无法验证任何
#   公开 registry 的证书。
# * 重启 dockerd 会中断正在运行的容器。
Environment="https_proxy=http://127.0.0.1:19770"
Environment="http_proxy=http://127.0.0.1:19770"
Environment="no_proxy=127.0.0.1,localhost,::1"
Environment="SSL_CERT_FILE=%h/.config/gh-accel/certs/ca-bundle.pem"
